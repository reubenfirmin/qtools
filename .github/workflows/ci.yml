name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-aarch64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --target aarch64-unknown-linux-gnu

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-llvm-cov
      - run: cargo test --locked --all-targets
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: cargo llvm-cov --locked --all-targets --fail-under-lines 95
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo audit
      - run: shellcheck packaging/appimage/AppRun packaging/appimage/build.sh
      - run: sh -n packaging/appimage/AppRun packaging/appimage/build.sh
